spring:
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reservation_demo?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:reservation_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  thymeleaf:
    cache: false

mybatis:
  type-aliases-package: com.mango.pojo
  mapper-locations: classpath:mybatis/mapper/*.xml
server:
  port: ${SERVER_PORT:9099}

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
