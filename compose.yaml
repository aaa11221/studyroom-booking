services:
  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        STATIC_IMAGE: ${STATIC_IMAGE:-busybox:1.36.1-musl}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:9099
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: dev
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-11-alpine}
        JRE_IMAGE: ${JRE_IMAGE:-bellsoft/liberica-openjre-alpine:11}
    working_dir: /workspace
    ports:
      - "9099:9099"
    volumes:
      - ./backend:/workspace
      - maven_cache:/home/app/.m2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/reservation_demo?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=reservation_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      - SERVER_PORT=9099
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9099/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: reservation_demo
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init_reservation_demo.sql:/docker-entrypoint-initdb.d/init_reservation_demo.sql:ro

volumes:
  mysql_data:
  maven_cache:
