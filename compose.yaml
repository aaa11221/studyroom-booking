services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:8080"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
    environment:
      - VITE_API_URL=http://localhost:9099
    depends_on:
      backend:
        condition: service_started

  backend:
    image: maven:3.9-eclipse-temurin-11
    working_dir: /app
    command: mvn -q spring-boot:run
    ports:
      - "9099:9099"
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/reservation_demo?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=reservation_user
      - SPRING_DATASOURCE_PASSWORD=Resv@123456
      - SERVER_PORT=9099
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reservation_demo
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: Resv@123456
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_reservation_demo.sql:/docker-entrypoint-initdb.d/init_reservation_demo.sql:ro

volumes:
  mysql_data:
  maven_cache:

